server:
    port: 8888

spring:
    application:
      name: config-server

    cloud:
      config:
        server:
          native:
            search-locations: classpath:/config

    profiles:
      active: native

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true


